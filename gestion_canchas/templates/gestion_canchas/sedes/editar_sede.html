{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Sede - CanchaFácil</title>
    <link rel="icon" href="{% static 'img/logo-green.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/listausers.css' %}">
</head>

<body class="adm-body bg-dark text-white min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow cancha-nav">
        <div class="container-fluid">
            <div class="d-flex align-items-center ms-5">
                <img src="{% static 'img/logo-green.png' %}" style="height:90px; object-fit:contain;" alt="Logo">

                <a
                    class="navbar-brand fw-bold ms-2 m-0 logo-text"
                    href="#"
                    style="font-size:2rem; color:#fff;"
                >
                    Cancha<span style="color:#62ff00;">Fácil</span>
                </a>

            </div>

        </div>
    </nav>


    <!-- CONTENIDO -->
    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <!-- BREADCRUMB -->
                <nav aria-label="breadcrumb" class="mb-3">

                    <ol class="breadcrumb">

                        <li class="breadcrumb-item">
                            <a
                                href="{% url 'gestion_canchas:lista_sedes' %}"
                                style="color:#62ff00;"
                            >
                                Sedes
                            </a>
                        </li>

                        <li class="breadcrumb-item active text-white">
                            Editar {{ sede.nombre }}
                        </li>

                    </ol>

                </nav>


                <!-- TARJETA -->
                <div
                    class="card border-0 shadow-lg"
                    style="
                        background-color:#03045e;
                        border-top:4px solid #62ff00 !important;
                    "
                >

                    <!-- CABECERA -->
                    <div
                        class="card-header border-0 py-3"
                        style="background-color:#020230;"
                    >

                        <h4 class="fw-bold mb-0" style="color:#62ff00;" >

                            <i
                                class="bi bi-pencil-square me-2"
                                style="color:#62ff00;"
                            ></i>

                            Editar Sede

                        </h4>

                    </div>


                    <!-- CUERPO -->
                    <div class="card-body p-4">

                        <form method="POST">

                            {% csrf_token %}


                            <!-- NOMBRE -->
                            <div class="mb-3">

                                <label class="form-label" style="color:#62ff00;">
                                    Nombre
                                </label>

                                <input
                                    type="text"
                                    name="nombre"
                                    class="form-control"
                                    value="{{ sede.nombre }}"
                                    required
                                >

                            </div>


                            <!-- DIRECCIÓN -->
                            <div class="mb-3">

                                <label class="form-label" style="color:#62ff00;">
                                    Dirección
                                </label>

                                <input
                                    type="text"
                                    name="direccion"
                                    class="form-control"
                                    value="{{ sede.direccion }}"
                                    required
                                >

                            </div>


                            <!-- CIUDAD -->
                            <div class="mb-3">

                                <label class="form-label" style="color:#62ff00;">
                                    Ciudad
                                </label>

                                <input
                                    type="text"
                                    name="ciudad"
                                    class="form-control"
                                    value="{{ sede.ciudad }}"
                                    required
                                >

                            </div>


                            <!-- TELÉFONO -->
                            <div class="mb-3">

                                <label class="form-label" style="color:#62ff00;">
                                    Teléfono
                                </label>

                                <input
                                    type="text"
                                    name="telefono"
                                    class="form-control"
                                    value="{{ sede.telefono }}"
                                >

                            </div>

                            <!-- BOTONES -->
                            <div class="d-flex gap-3">
                                <a
                                    href="{% url 'gestion_canchas:lista_sedes' %}"
                                    class="btn btn-secondary rounded-pill px-4"
                                >
                                    <i class="bi bi-arrow-left me-1"></i>
                                    Cancelar
                                </a>


                                <button
                                    type="submit"
                                    class="btn rounded-pill px-4 fw-bold flex-grow-1"
                                    style="
                                        background-color:#62ff00;
                                        color:black;
                                    "
                                >

                                    <i class="bi bi-save me-1"></i>

                                    Guardar Cambios

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- BOOTSTRAP JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
