{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Recuperar Contraseña</title>
  <link rel="icon" href="{% static 'img/logo-green.png' %}" />
  <link rel="stylesheet" href="{% static 'css/editarusers.css' %}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="admin-card p-4 text-center shadow-lg bg-black">
    <img src="{% static 'img/logo-green.png' %}" alt="Logo de CanchaFácil" class="mb-3 img-fluid" width="90"
      height="90" />

    <h1 class="h3 mb-4 fw-bold text-white">Recuperar Contraseña</h1>

    <p class="text-center fw-bold text-white">Escribe el correo con el que te registraste.</p>

    {% if error %}
    <div class="alert alert-danger">
      {{ error }}
    </div>
    {% endif %}

    {% if mensaje %}
    <div class="alert alert-success">
      {{ mensaje }}
    </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}

      <div class="mb-3 text-start">
        <label class="form-label text-white fw-semibold">Correo</label>
        <input type="email" name="email" class="form-control custom-input bg-dark text-white"
          placeholder="Ingrese su correo" required />
      </div>

      <button type="submit" class="btn btn-custom w-100 rounded-pill fw-bold mt-3 py-2">
        Enviar código
      </button>

      <div class="login-links mt-3">
        <a href="{% url 'login' %}" class="secondary-link text-decoration-none fw-semibold">Volver al login</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
