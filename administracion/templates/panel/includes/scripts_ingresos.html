<script>
(function () {
    let graficaIngresos;
    let graficaEstados;

    // --- 1. OBTENCIÓN DE DATOS EN TIEMPO REAL ---
    async function obtenerDatosIngresos() {
        try {
            // Agregamos Date.now() para ignorar el caché del navegador HTTP
            const resp = await fetch("{% url 'ingresos_chart_data' %}?_=" + Date.now());
            return await resp.json();
        } catch (error) {
            console.error("Error al obtener ingresos:", error);
            return null;
        }
    }

    // --- 2. GRÁFICA DE INGRESOS ---
    function crearGraficaIngresos(periodo, datos) {
        const canvas = document.getElementById('graficaIngresos');
        if (!canvas || !datos || !datos[periodo]) return;
        
        const ctx = canvas.getContext('2d');
        const d = datos[periodo];

        if (graficaIngresos) graficaIngresos.destroy();

        graficaIngresos = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: d.labels,
                datasets: [{
                    label: 'Ingresos ($)',
                    data: d.valores,
                    backgroundColor: d.valores.map(v => v > 0 ? 'rgba(98,255,0,0.7)' : 'rgba(255,255,255,0.05)'),
                    borderColor: '#62ff00',
                    borderWidth: 2,
                    borderRadius: 8,
                    borderSkipped: false,
                    hoverBackgroundColor: '#62ff00',
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#121212',
                        titleColor: '#62ff00',
                        bodyColor: '#fff',
                        borderColor: '#62ff00',
                        borderWidth: 1,
                        callbacks: {
                            label: ctx => ' $' + ctx.raw.toLocaleString('es-CO')
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#fff', font: { family: 'Nunito', weight: '700' } },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    y: {
                        ticks: {
                            color: '#aaa',
                            callback: val => '$' + (val / 1000000).toFixed(1) + 'M'
                        },
                        grid: { color: 'rgba(255,255,255,0.07)' },
                        beginAtZero: true
                    }
                }
            }
        });
    }

    window.actualizarGrafica = async function () {
        const filtro = document.getElementById('filtro-periodo');
        if (!filtro) return;
        const periodo = filtro.value;
        const datos = await obtenerDatosIngresos();
        if (datos) crearGraficaIngresos(periodo, datos);
    };

    // --- 3. GRÁFICA DE ESTADOS ---
    function actualizarGraficaEstados() {
        const canvas = document.getElementById('graficaEstados');
        if (!canvas) return;

        const dataConfirmadas = document.getElementById('data-confirmadas');
        const dataPendientes  = document.getElementById('data-pendientes');
        const dataCompletadas = document.getElementById('data-completadas');
        const dataCanceladas  = document.getElementById('data-canceladas');

        if (!dataConfirmadas || !dataPendientes || !dataCompletadas || !dataCanceladas) {
            return;
        }

        const confirmadas = JSON.parse(dataConfirmadas.textContent);
        const pendientes  = JSON.parse(dataPendientes.textContent);
        const completadas = JSON.parse(dataCompletadas.textContent);
        const canceladas  = JSON.parse(dataCanceladas.textContent);

        if (graficaEstados) graficaEstados.destroy();

        graficaEstados = new Chart(canvas.getContext('2d'), {
            type: 'doughnut',
            data: {
                labels: ['Confirmadas', 'Pendientes', 'Completadas', 'Canceladas'],
                datasets: [{
                    data: [confirmadas, pendientes, completadas, canceladas],
                    backgroundColor: ['#62ff00', '#ffc107', '#0dcaf0', '#dc3545'],
                    borderColor: '#111',
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#ccc', font: { family: 'Nunito', size: 11 } }
                    },
                    tooltip: {
                        backgroundColor: '#121212',
                        titleColor: '#62ff00',
                        bodyColor: '#fff',
                        borderColor: '#62ff00',
                        borderWidth: 1,
                    }
                }
            }
        });
    }

    // --- 4. INICIALIZACIÓN Y AUTO-REFRESCO ---
    function init() {
        if (typeof Chart !== 'undefined') {
            // Carga inicial
            window.actualizarGrafica();
            actualizarGraficaEstados();

            // Polling: Actualiza automáticamente cada 30 segundos (30000ms)
            setInterval(() => {
                window.actualizarGrafica();
                actualizarGraficaEstados();
            }, 30000);
        } else {
            setTimeout(init, 100);
        }
    }

    init();
})();
</script>
