{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pago cancelado - CanchaFácil</title>
    <link rel="icon" href="{% static 'img/logo-green.png' %}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            background: #f3f5fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .card-cancelado {
            max-width: 450px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px 30px;
            text-align: center;
        }
        .icono-cancelado {
            font-size: 4rem;
            color: #ffc107;
            background: rgba(255,193,7,0.1);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .btn-volver-pago {
            background: #03045e;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-volver-pago:hover {
            background: #05087a;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card card-cancelado">
        <div class="icono-cancelado">
            <i class="bi bi-x-circle-fill"></i>
        </div>
        <h2 style="color: #03045e; font-weight: 800;">Pago cancelado</h2>
        <p class="text-muted" style="font-size: 1.05rem;">
            No se ha realizado ningún cargo.
        </p>
        <p class="text-muted small">
            Puedes intentarlo nuevamente cuando quieras.
        </p>
        <div class="d-flex flex-column gap-3 mt-3">
            <a href="{% url 'pago' %}" class="btn btn-volver-pago">
                <i class="bi bi-arrow-repeat me-2"></i>Volver al pago
            </a>
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">
                <i class="bi bi-house me-2"></i>Ir al inicio
            </a>
        </div>
    </div>
</body>
</html>
